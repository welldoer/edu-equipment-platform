version: "1"
services:
    db:
        image: mysql:${MYSQL_VERSION}
        container_name: mysql_${MYSQL_VERSION}
        ports:
            - ${REAL_MYSQL_PORT}:3306
        volumes:
            - ${MYSQL_DIR}/data:/var/lib/mysql
            - ${MYSQL_DIR}/mysql-files:/var/lib/mysql-files
            - ${MYSQL_DIR}/my.cnf:/etc/mysql/my.cnf
            - ${MYSQL_DIR}/logs:/logs
        environment:
            TZ: Asia/Shanghai
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_ROOT_HOST: ${MYSQL_ROOT_HOST}
        logging:
            driver: "json-file"
            options:
                max-size: "200m"
                max-file: "3"
        restart: always
    db_admin:
        image: adminer:${DB_ADMIN_VERSION}
        container_name: db_admin_${DB_ADMIN_VERSION}
        ports:
            - ${DB_ADMIN_PORT}:8080
        depends_on:
            - db
    cache:
        image: redis:${REDIS_VERSION}
        container_name: redis_${REDIS_VERSION}
        ports:
            - ${REAL_REDIS_PORT}:6379
        volumes:
            - ${REDIS_DIR}/data:/data
            - ${REDIS_DIR}/redis.conf:/etc/redis/redis.conf
            - ${REDIS_DIR}/logs:/logs
        logging:
            driver: "json-file"
            options:
                max-size: "200m"
                max-file: "3"
        restart: always
        command: ["redis-server", "/etc/redis/redis.conf"]

    minio:
        image: quay.io/minio/minio:${MINIO_VERSION}
        container_name: minio_${MINIO_VERSION}
        ports:
            - ${REAL_MINIO_API_PORT}:9000
            - ${REAL_MINIO_CONSOLE_PORT}:9001
        volumes:
            - ${MINIO_DIR}/data:/data
        environment:
            TZ: Asia/Shanghai
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        restart: always
        command: ["server", "/data", "--console-address", ":9001"]
