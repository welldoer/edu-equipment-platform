version: '1'
services:
  eemp-mysql:
    build:
      context: ./db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
      TZ: Asia/Shanghai
    restart: always
    container_name: eemp-mysql
    image: eemp-mysql
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
      --max_allowed_packet=128M
      --default-authentication-plugin=caching_sha2_password
    ports:
      - 3306:3306

  eemp-db-admin:
    image: adminer
    container_name: eemp-db-admin
    ports:
      - 3006:8080
    depends_on:
      - eemp-mysql

  eemp-redis:
    image: redis:6.2
    ports:
      - 6379:6379
    restart: always
    hostname: eemp-redis
    container_name: eemp-redis

  eemp-minio:
    image: quay.io/minio/minio
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - ./data/minio:/data
    restart: always
    hostname: eemp-minio
    container_name: eemp-minio
    command:
      server
      /data
      --console-address=":9001"

  eemp-system:
    build:
      context: ./eemp-server
    restart: on-failure
    depends_on:
      - eemp-mysql
      - eemp-redis
      - eemp-minio
    container_name: eemp-system
    image: eemp-system
    hostname: eemp-system
    ports:
      - 8080:8080